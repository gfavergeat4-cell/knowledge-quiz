<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 2/11 au 8/11</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W45", "title": "Semaine du 2/11 au 8/11", "total": 20, "lessons": 12, "questions": [{"n": 1, "type": "mcq", "question": "Anderson says Amazon Auctions failed against eBay. What reason does the lesson give?", "options": ["Amazon charged sellers higher fees than eBay did", "Amazon shoppers expected to pick a product and pay a fixed, low price, and did not shift their habits to bidding", "The auction software was too slow to handle Amazon's traffic", "Buyers feared losing the item and moved to zShops instead"], "answer": "B", "explanation": "The lesson says Amazon customers valued price certainty, while eBay users accepted bidding even at the risk of losing the item. Fees and software are not given as the cause; zShops was a separate later experiment, closed because of its extra steps.", "points": 1.5, "lessons": [{"title": "Successful failure: why Amazon budgets for experiments that will not work", "author": "Steve Anderson", "book": "The Bezos Letters", "when": "2/11 au soir"}]}, {"n": 2, "type": "multi", "question": "Which of these does Hormozi name as places where you build a prospect's conviction that the offer will work for them?", "options": ["The messaging", "The proof", "A lower price", "The guarantees", "What you decide to put in the offer or leave out of it"], "answer": ["A", "B", "D", "E"], "explanation": "He names four: messaging, proof, the contents of the offer, and guarantees. A lower price is not one of them; raising certainty adds value without changing the work you do, while cutting price only gives value away.", "points": 2.0, "lessons": [{"title": "The value equation: why certainty and speed set the price", "author": "Alex Hormozi", "book": "$100M Offers", "when": "3/11 au matin"}]}, {"n": 3, "type": "truefalse", "question": "Brunson argues that staying neutral on hard questions protects you from critics and still leaves you well known.", "options": [], "answer": false, "explanation": "Brunson says neutrality protects you from critics but also leaves you unknown. Taking a clear stand sorts the audience into supporters, neutrals and opponents, and the devoted supporters are the ones who buy; critics come with the package.", "points": 1.5, "lessons": [{"title": "Polarity: why Brunson says a neutral voice reaches nobody", "author": "Russell Brunson", "book": "DotCom Secrets", "when": "3/11 au soir"}]}, {"n": 4, "type": "mcq", "question": "Hormozi's theory is that a client judges value over the last billing period, not the whole relationship. Which rule follows from it?", "options": ["Bill monthly so each payment feels small", "Bill as rarely as possible, because each invoice is an occasion to cancel", "Show the largest unit and charge the smallest", "Sell one-time and ongoing value under a single price so it looks simpler"], "answer": "B", "explanation": "Each invoice is a chance to cancel, and a long cycle leaves more time to deliver. He also says to show the smallest unit but charge the largest, and to separate one-time from ongoing value, so options C and D invert his rules.", "points": 1.5, "lessons": [{"title": "How Hormozi thinks about price: value, billing rhythm and customer surplus", "author": "Alex Hormozi", "book": "$100M Pricing Playbook", "when": "4/11 au soir"}]}, {"n": 5, "type": "truefalse", "question": "For a price raise of 50% or more, Hormozi recommends one identical announcement sent to every customer at once.", "options": [], "answer": false, "explanation": "He suggests removing the loyalty discount in steps every six months for a large raise, and at 50% or more, doing it individually if call volume allows. A single mass announcement is the opposite of that.", "points": 1.5, "lessons": [{"title": "The mistake of never touching your prices", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "5/11 au matin"}]}, {"n": 6, "type": "mcq", "question": "Cialdini says to ask what you want from the item. When does scarcity give a fair signal of its worth to you?", "options": ["When you want it for its function, such as eating or driving", "When you want it for the satisfaction of owning something rare", "When many other buyers are competing for it", "When your arousal is high, because it shows true value"], "answer": "B", "explanation": "If the joy is in possessing something rare, scarcity is a fair guide. If you want what the thing does, limited supply does not make it work better; the cookie study showed rare cookies were wanted more but not rated tastier. Rising arousal is the alarm, not a measure of value.", "points": 1.5, "lessons": [{"title": "Cialdini's question for scarcity: what do you actually want from the thing?", "author": "Robert Cialdini", "book": "Influence", "when": "5/11 au soir"}]}, {"n": 7, "type": "multi", "question": "Which of these does Ogilvy say you should avoid hiring?", "options": ["Friends", "A senior partner brought in from outside the agency", "A client's children", "Clients themselves", "Someone with fresh ideas from another agency"], "answer": ["A", "C", "D"], "explanation": "He lists friends, a client's children, your own or your partners' children, stars from other fields, and clients. He actually recommends bringing in senior figures from outside now and then to refresh the blood.", "points": 2.0, "lessons": [{"title": "Ogilvy on running an agency: who to hire, how to stop politics, what leaders are made of", "author": "David Ogilvy", "book": "Ogilvy on Advertising", "when": "6/11 au matin"}]}, {"n": 8, "type": "mcq", "question": "Why does Alex choose not to explain the full new method to Bill Peach after a good month?", "options": ["The plant's efficiency numbers fell too far to defend", "He expects Peach to harden and order a return to cost-accounting methods, so he wants a solid case first", "Jonah told him to keep it secret from management", "Peach has already approved the closing of the plant"], "answer": "B", "explanation": "Alex thinks Peach is smart but not an innovator and would revert to the old rules if shown too early. Efficiency dipped only slightly and is recovering, and the closing threat is still open, not decided.", "points": 1.5, "lessons": [{"title": "The Goal: why a good month isn't proof, and why Alex waits before telling his boss", "author": "Eliyahu M. Goldratt & Jeff Cox", "book": "The Goal", "when": "6/11 au soir"}]}, {"n": 9, "type": "mcq", "question": "In Hormozi's four split tests of free versus premium front ends, what differed between the two groups?", "options": ["Closing percentage, favoring premium", "Average ticket, favoring premium", "Number of leads and what they cost, favoring free", "Nothing measurable"], "answer": "C", "explanation": "Closing percentage and average ticket were identical. Free produced many more leads, and lead cost fell by a factor of five or more. Charging up front gave no edge on close rate or ticket.", "points": 1.5, "lessons": [{"title": "Free versus premium front ends: two different acquisition models", "author": "Alex Hormozi", "book": "$100M Lost Chapters", "when": "7/11 au matin"}]}, {"n": 10, "type": "mcq", "question": "In Marketo's scoring model, how are names above and below 65 points treated?", "options": ["Below 65 are leads, above 65 are prospects", "Below 65 are prospects, above 65 are leads handed to sales", "Below 65 are dropped, above 65 enter stay-in-touch campaigns", "Below 65 go to sales, above 65 receive only automated email"], "answer": "B", "explanation": "Names under 65 are prospects (colder) and names above 65 are leads (warmer). Sales works only the warm ones; those who never engage go to stay-in-touch drip campaigns.", "points": 1.5, "lessons": [{"title": "From anonymous visitor to sales-ready lead: Marketo's scoring and follow-up playbook", "author": "Aaron Ross & Marylou Tyler", "book": "Predictable Revenue", "when": "7/11 au soir"}]}, {"n": 11, "type": "open", "question": "A prospect says your service costs more than a competitor's that promises the same outcome. Using Hormozi's value equation and his thinking on price, what do you do to defend a higher price?", "options": [], "answer": "The dream outcome is the same, so price is decided by the other variables: raise the prospect's certainty (messaging, proof, offer contents, guarantees), shorten the time delay with an early win, and keep effort low. Tie price to value created, accept a premium price to fund a better product and leave customer surplus, and bill in a way that fits the lookback window.", "explanation": "Both lessons say price follows perceived value, not cost of delivery. Certainty and speed raise value without extra work, and a premium price funds the better product that creates customer surplus.", "points": 2.0, "lessons": [{"title": "The value equation: why certainty and speed set the price", "author": "Alex Hormozi", "book": "$100M Offers", "when": "3/11 au matin"}, {"title": "How Hormozi thinks about price: value, billing rhythm and customer surplus", "author": "Alex Hormozi", "book": "$100M Pricing Playbook", "when": "4/11 au soir"}]}, {"n": 12, "type": "open", "question": "You want an affiliate to sell your core offer and take a larger share of your profit. Using both lessons, how do you decide how much to share and what you need to know first?", "options": [], "answer": "Strategy 3: the affiliate sells your core offer and takes a larger share of lifetime gross profit, while you only deliver. Know your lifetime gross profit first (gross profit times transactions, or gross profit divided by churn) so you see what you can afford to share. Hormozi's options: share upfront cash, share for a set period, or share forever, which he prefers so affiliates keep your customers.", "explanation": "The integration lesson gives the structure and the three ways to split money, and the LTGP lesson gives the number that tells you what a customer is worth and thus what share is affordable.", "points": 2.0, "lessons": [{"title": "Integration: three ways to plug your offer into an affiliate's business", "author": "Alex Hormozi", "book": "$100M Leads", "when": "2/11 au matin"}, {"title": "Lifetime gross profit: the number Hormozi says decides who wins", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "4/11 au matin"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
