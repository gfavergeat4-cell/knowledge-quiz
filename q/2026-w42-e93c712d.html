<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 12/10 au 18/10</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W42", "title": "Semaine du 12/10 au 18/10", "total": 20, "lessons": 11, "questions": [{"n": 1, "type": "multi", "question": "Which of these are really part of Hormozi's installation checklist for lifecycle ads?", "options": ["Legal puts compliance and permission wording in every customer contract.", "IT records all calls, buys extra storage and switches off auto-delete.", "Sales passes every call, good or bad, to marketing each day.", "Everyone creates a calendar event per call with the client's name in the title.", "Once the client has signed the permission wording, the team no longer needs to ask before using a clip."], "answer": ["A", "B", "D"], "explanation": "The checklist goes department by department: Legal for permission wording, IT for recording and storage, everyone for calendar events named after the client, so marketing can later search by name. Sales passes only happy-customer calls, and weekly, not every call daily. And the signature does not close the consent question: his team still asks whether the client is comfortable, and respects a no.", "points": 2.0, "lessons": [{"title": "Hormozi's system for turning everyday client moments into ads", "author": "Alex Hormozi", "book": "$100M Marketing Machine", "when": "12/10 au matin"}]}, {"n": 2, "type": "multi", "question": "Which of these belong to Hormozi's way of raising prices on existing customers?", "options": ["Test the increase on new customers first.", "Announce the raise several months ahead so customers have time to prepare.", "Show one to five points of value already received, personalized with the customer's data.", "Offer a permanent loyalty discount to long-standing customers.", "Name three investments the extra profit will fund and how they benefit the customer."], "answer": ["A", "C", "E"], "explanation": "He tests on new customers, then treats existing ones separately: value already received, then three investments the profit will pay for. The two traps reverse his rules. He announces that the raise happens now, not months ahead, and the loyalty discount expires. For a large raise he even removes it in steps every six months, because people accept a disappearing discount more easily than a higher price.", "points": 2.0, "lessons": [{"title": "The mistake of never touching your prices", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "13/10 au soir"}]}, {"n": 3, "type": "mcq", "question": "After the first pass of 50 borrowed hooks, how does Hormozi split each following batch?", "options": ["70% entirely new hooks, 20% variations of the winners, 10% the winners themselves.", "70% reuses the top five winners, 20% are variations of them, 10% are entirely new hooks.", "70% variations of the winners, 20% the winners themselves, 10% entirely new hooks.", "A fresh set of 50 borrowed hooks each time, keeping only the top 10% from the previous batch."], "answer": "B", "explanation": "The loop leans on what already works: most of the batch reuses the top 10% of performers, which he counts as the top five. Variations change either the wording or the visual, and only a tenth is new, found the same way as in the first pass. The tempting error is to give the large share to novelty, when his point is that winners are reused before anything else.", "points": 1.5, "lessons": [{"title": "The hook as first impression: Hormozi's 70/20/10 loop for improving it", "author": "Alex Hormozi", "book": "$100M Hooks Playbook", "when": "14/10 au matin"}]}, {"n": 4, "type": "truefalse", "question": "On a larger project, Hormozi advises staying silent until there is real progress to report, because an update with nothing new erodes trust.", "options": [], "answer": false, "explanation": "He says the opposite: report progress as often as possible, and even an update with nothing new beats silence. Each update counts as a win and as a promise kept, which is what makes recommending you feel less risky. The customer should never wonder what comes next, hence his rule of always announcing the next contact.", "points": 1.5, "lessons": [{"title": "Faster wins: Hormozi's delivery playbook for turning customers into referrers", "author": "Alex Hormozi", "book": "$100M Leads", "when": "14/10 au soir"}]}, {"n": 5, "type": "mcq", "question": "A prospect company sends you down to the people who will carry out the work. What does Ross advise?", "options": ["Treat it as a brush-off and go straight back up to whoever signs.", "Work only with those people and avoid the top person until the contract stage.", "Ask who the decision maker is and concentrate your effort on that one person.", "Accept it as a legitimate entry point, build a relationship with the top person early, but do not pitch them before the influencers accept your case."], "answer": "D", "explanation": "Ross argues that executives now lean on their teams, so the process matters more than the person who signs. Being sent to the implementers is a valid way in. The relationship with the top person starts early, yet pitching them an argument their own team does not support makes you look weak. Asking who decides or who signs is exactly the question he says to drop.", "points": 1.5, "lessons": [{"title": "Three closing mistakes from Predictable Revenue: the process, the proof, the dead deals", "author": "Aaron Ross & Marylou Tyler", "book": "Predictable Revenue", "when": "15/10 au matin"}]}, {"n": 6, "type": "mcq", "question": "What does Hormozi report happened each time his own company removed a qualification step from the buying journey?", "options": ["Leads rose and income rose, but gross margin shrank.", "Leads fell and income fell.", "Leads rose and income fell.", "Leads stayed flat and the close rate went up."], "answer": "C", "explanation": "Removing a step makes the funnel look healthier because more leads come through, which is why competitors who copy the journey get nervous and cut steps. But income dropped each time, since the leads no longer followed the path of the best customers. The tension ended when marketing and sales were merged into one team judged on closing many valuable deals.", "points": 1.5, "lessons": [{"title": "Quality over quantity: why Hormozi keeps the steps that slow his buyers down", "author": "Alex Hormozi", "book": "$100M Offers: The Lost Chapter", "when": "15/10 au soir"}]}, {"n": 7, "type": "mcq", "question": "According to Hormozi, what shapes a brand most in the long run, and why?", "options": ["The product, because people have far more meaningful contact with it than with ads.", "Advertising, because it is the first thing a customer meets and frames everything after.", "What affiliates and customers say, because other people's words outweigh your own.", "The price, because a premium price signals a premium brand."], "answer": "A", "explanation": "He separates timing: advertising shapes the brand most in the short run, the product most in the long run, because contact with the product is far more frequent and meaningful. What others say does outweigh what you say, but the person's own experience carries the most authority and decides what they repeat. His example is the hat that arrives with a hole: the buyer judges the whole company by it.", "points": 1.5, "lessons": [{"title": "How Hormozi thinks about brand: three levels of authority, and a loop that runs both ways", "author": "Alex Hormozi", "book": "$100M Branding Playbook", "when": "16/10 au matin"}]}, {"n": 8, "type": "truefalse", "question": "At the Tennessee graphite electrode plant, applying the constraint method sharply improved on-time delivery, and that improvement is what released close to $20 million.", "options": [], "answer": false, "explanation": "On-time delivery did not move: it was excellent before and excellent after. What changed was how it was achieved. Punctuality had depended on shelves holding more stock than needed, and afterwards the plant delivered on time with roughly 40% less inventory. The money came from that released stock, not from better delivery.", "points": 1.5, "lessons": [{"title": "Same idea, new context: what The Goal's interviews say about constraints outside the factory", "author": "Eliyahu M. Goldratt & Jeff Cox", "book": "The Goal", "when": "16/10 au soir"}]}, {"n": 9, "type": "mcq", "question": "Which closing question matches Atkinson's advice?", "options": ["\"Won't you take one today?\"", "\"Can't I put you down for one?\"", "\"This is quite an improvement, isn't it?\"", "\"Is there any chance you would consider it?\""], "answer": "C", "explanation": "Atkinson wants questions that cannot easily be answered \"No\": an affirmative statement followed by the question tends to draw an affirmative answer, because the mind follows the line of least resistance. \"Won't you\" and \"Can't I\" suggest the negative answer themselves. Asking as if the outcome were a matter of chance breaks his other rule, since confident expectation is what is contagious.", "points": 1.5, "lessons": [{"title": "Producing the \"click\" of decision: how Atkinson closes a sale", "author": "William Walker Atkinson", "book": "The Psychology of Salesmanship", "when": "17/10 au matin"}]}, {"n": 10, "type": "mcq", "question": "In the four split tests of free against premium front-end offers that Hormozi reports, what was the result?", "options": ["Close rate and average ticket were identical; the number of leads and their cost changed, with free most often cutting lead cost by five times or more.", "Premium closed at a higher rate, which roughly offset its higher lead cost.", "Free brought more leads but a lower average ticket, since it attracted freebie seekers.", "Premium leads cost more but bought at a higher ticket, so both models ended equal."], "answer": "A", "explanation": "The gym owners' fear was that free only attracts freebie seekers. His answer is \"right and wrong\": more unqualified people do come in, yet closing percentage and ticket were the same in both groups. Charging up front gave no edge on either measure, so the difference was volume and lead cost. That is why a premium front end only works if the price rises as much as the lead cost does.", "points": 1.5, "lessons": [{"title": "Free versus premium front ends: two different acquisition models", "author": "Alex Hormozi", "book": "$100M Lost Chapters", "when": "17/10 au soir"}]}, {"n": 11, "type": "mcq", "question": "A prospect says \"I'm not sure this is right for us\" and stops talking. Putting Lowndes and Ross together, what is the best next move?", "options": ["Present a different option straight away, and drop the deal at the monthly pipeline clean-up if nothing moves.", "Ask who signs the contract and request a meeting with that person.", "Ask calmly what it would take to close by a given date, since tone counts more than the words.", "Echo \"Right for you?\" in a sympathetic, questioning tone to surface the real objection, then ask how they evaluated similar products before and who takes part."], "answer": "D", "explanation": "For Lowndes a vague objection is a starting point, not a reason to move to the next option: Paul's three echoes told him which cars to show. Ross then supplies what to learn once the prospect is talking: how the choice gets made and who is involved, not who signs. Moving on immediately repeats the mistake Paul avoided, and the bold closing question comes before you know what the hesitation is about.", "points": 2.0, "lessons": [{"title": "Parroting: repeat the last few words and let the other person talk", "author": "Leil Lowndes", "book": "How to Talk to Anyone", "when": "13/10 au matin"}, {"title": "Three closing mistakes from Predictable Revenue: the process, the proof, the dead deals", "author": "Aaron Ross & Marylou Tyler", "book": "Predictable Revenue", "when": "15/10 au matin"}]}, {"n": 12, "type": "open", "question": "One Hormozi lesson says to keep the steps that slow buyers down, even if they produce fewer leads. Another says that if he could make only one offer he would choose a free front end, which brings in many unqualified leads. Why are the two positions not contradictory?", "options": [], "answer": "Both are judged on money over time, not on lead count or on how the sales team feels. The free front end sits at the entry: in his tests it cut lead cost by five times or more while close rate and ticket stayed the same, so volume is cheap. The friction comes after: he prefers sorting poor leads and adding friction afterwards to an empty calendar, and the friction he keeps is the path of the best customers (two or more long-form pieces of content before buying). Removing those steps raised leads and lowered income.", "explanation": "The two lessons act on different points of the journey. Free widens the top at low cost; the qualification steps filter that volume toward the highest-value customers. The shared rule is that neither volume nor the share of qualified leads is the target: the return is. He would rather spend $5,000 to bring in $45,000 than $1,000 to bring in $5,000.", "points": 2.0, "lessons": [{"title": "Quality over quantity: why Hormozi keeps the steps that slow his buyers down", "author": "Alex Hormozi", "book": "$100M Offers: The Lost Chapter", "when": "15/10 au soir"}, {"title": "Free versus premium front ends: two different acquisition models", "author": "Alex Hormozi", "book": "$100M Lost Chapters", "when": "17/10 au soir"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
