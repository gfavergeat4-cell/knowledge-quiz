<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 9/11 au 15/11</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W46", "title": "Semaine du 9/11 au 15/11", "total": 20, "lessons": 4, "questions": [{"n": 1, "type": "mcq", "question": "Why does Hormozi make the closing campaign exactly one week long?", "options": ["Longer than a week and the urgency fades; shorter and he cannot meet everyone before the cut-off", "A week is the time the email sequence needs to reach every lead at least twice", "Shorter than a week would not give clients time to pay, and longer would tire the sales team", "Longer than a week makes the offer look cheap, and shorter makes it look pushy"], "answer": "A", "explanation": "He gives two limits: past a week, urgency fades; under a week, he cannot speak to everyone before the deadline. The other options sound plausible but are not his reasons.", "points": 1.5, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 2, "type": "truefalse", "question": "If the offer has not sold out by day three or four, Hormozi says to keep sending the rest of the sequence, because the final messages do the heavy lifting.", "options": [], "answer": false, "explanation": "His benchmark is that a strong offer sells out by day three or four. If it has not, he says to improve the offer before sending the rest, not to rely on later messages.", "points": 1.5, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 3, "type": "multi", "question": "Which of these are part of how Hormozi sets up the one-week campaign?", "options": ["Use text for attention and email for the detail", "Text the day before with a simple question asking for a thumbs up", "Book calls right away so every conversation happens before the deadline", "Stretch the campaign to two or three weeks so busy clients have time to decide", "Wait until day seven to see whether the offer sells before changing anything"], "answer": ["A", "B", "C"], "explanation": "Text plus email, the thumbs-up question the day before, and immediate call booking are all in his setup. A longer campaign kills urgency, and waiting until day seven contradicts his day-three-or-four check.", "points": 2.0, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 4, "type": "mcq", "question": "What did the Ravenswood chairman's card ending in \"No Wimpy Wines\" show, according to Williams?", "options": ["A short statement of identity can create a bond with a customer before the product is even tasted", "Wine buyers respond best to humour and a slightly aggressive tone", "A vertical business card is a stronger format than a letter or a brochure", "A direct answer to a mailing builds trust because it proves the company is honest"], "answer": "A", "explanation": "Williams felt an instant bond with anyone who refuses wimpiness and tried the wine because of it. The point is identity, not tone, format or honesty.", "points": 1.5, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 5, "type": "truefalse", "question": "Williams says Walter Mitty remains popular because he is a deluded man who needs to grow up and see the world as it is.", "options": [], "answer": false, "explanation": "Williams insists Mitty is not mad: he simply cannot get the outside world to recognize who he is within. The story lasts because every reader has played cowboy, astronaut, princess or nurse. And he adds that strict honesty would say grow up, while selling means talking to the knight and the captain.", "points": 1.5, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 6, "type": "mcq", "question": "In Williams's view, what may be the strongest felt need in society today?", "options": ["The need to belong and to define who you are", "The need to save money on every purchase", "The need to be reassured that a product is safe", "The need to be recognized as an expert by others"], "answer": "A", "explanation": "He cites Richard Exley's phrase, a need to belong, and says it shapes the car, house, clothes, clubs and even the cola people choose. Most buying is self-expression.", "points": 1.5, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 7, "type": "mcq", "question": "What does Hormozi say to do with recurring meetings each quarter?", "options": ["Wipe out all of them, add back only the necessary ones, and try to run those in half the time", "Keep them all but move them to a shared call to save travel", "Cut the number in half and keep the same length", "Replace each of them with a written report that clients receive"], "answer": "A", "explanation": "His method is a quarterly reset: delete every recurring meeting, restore only what is necessary, and aim to halve their length. Meetings also cost the customer time, not only the company.", "points": 1.5, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 8, "type": "truefalse", "question": "Hormozi presents prepaying and buying in bulk, to lock in vendor discounts of about 10 to 20%, as a guaranteed return on cash.", "options": [], "answer": true, "explanation": "He frames the vendor discount as a guaranteed return on the cash you commit early. It is the last item on his list of cost savings.", "points": 1.5, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 9, "type": "mcq", "question": "A software company charging $30 a month had its CEO phone its 300 largest users and move them to about $3,000 on average. What happened?", "options": ["Only one left", "About half cancelled but revenue still rose", "Most stayed for a month and then churned", "A third of them asked for a discount"], "answer": "A", "explanation": "Hormozi uses this to show that people who see the value stay: only one of the 300 left. The other options invent a churn figure the lesson does not give.", "points": 1.5, "lessons": [{"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 10, "type": "multi", "question": "Which statements match Hormozi's worked price example and his advice?", "options": ["At $20, 4 buyers worth $200 each give $800, up from $500 at $10", "At $100, 2 buyers worth $300 each give $600, better than the start but worse than $20", "At $100 the result beats $20, so the highest price is always best", "Doubling price while closing 20% fewer deals is worth doing", "Test the new price on existing customers first, then extend it to new ones"], "answer": ["A", "B", "D"], "explanation": "The numbers are $500, $800 and $600, so the best price is in the middle, not the top. His advice is the reverse of E: test on new customers first, then existing ones if sales and churn hold.", "points": 2.0, "lessons": [{"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 11, "type": "mcq", "question": "You are writing the announcement message for a one-week offer. Using both lessons, which message follows the most important principles?", "options": ["A precise offer with an end date, written to the picture the buyer has of themselves rather than to their measurable facts", "A long list of every feature, with the date hidden at the end so it does not feel pushy", "A message about the buyer's age, income and location, with a deadline of whenever you are ready to close", "A funny message with no price or date, so the buyer replies out of curiosity"], "answer": "A", "explanation": "Hormozi says people decide when the offer is precise and has a date after which it is gone. Williams says to address the buyer as they see themselves, not as the world sees them. The other options drop one half or the other.", "points": 2.0, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}, {"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 12, "type": "mcq", "question": "A service business wants more profit while keeping the result for the client the same. Which plan fits both Hormozi lessons?", "options": ["Test a higher price on new customers and cut delivery cost, for example with usage caps or a done-with-you model, without changing the outcome", "Keep the price and cut delivery cost to zero, since cost has no ceiling", "Raise the price for everyone at once and cut delivery quality to protect the margin", "Lower the price to win more buyers, then add custom work for each one to keep them"], "answer": "A", "explanation": "Price has no ceiling and cost has a floor at zero, so he treats both as levers. But cost cuts must leave the result identical, and price changes are tested first on new customers. Cutting quality or going to zero cost breaks his rule.", "points": 2.0, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}, {"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
