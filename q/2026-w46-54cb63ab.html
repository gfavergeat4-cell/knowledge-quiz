<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 9/11 au 15/11</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W46", "title": "Semaine du 9/11 au 15/11", "total": 20, "lessons": 8, "questions": [{"n": 1, "type": "mcq", "question": "In Hormozi's 'impatience mistake' opener, what exactly is the error he points at?", "options": ["Starting a podcast at all instead of using short-form video", "Expecting a fast payoff, like blowing up in 90 days, from a slow activity", "Publishing too many episodes without a clear topic", "Talking about a business you have never run"], "answer": "B", "explanation": "The error is the timeline expectation: people think about 90 days of podcasting will be enough. The podcast itself is not the problem, and the 'never run a business' complaint belongs to a different opener in the same list.", "points": 1.5, "lessons": [{"title": "The impatience mistake: a hook that names a wrong belief and answers with your own record", "author": "Alex Hormozi", "book": "$100M Hooks Playbook", "when": "11/11 au matin"}]}, {"n": 2, "type": "mcq", "question": "In The Goal, the fast boys at the back of the line ask to put someone quicker in front. What does Rogo answer?", "options": ["Fine, as long as Herbie is moved to the middle of the line", "No: if they want to go faster, they must find a way to help Herbie go faster", "Yes, but the fast boys must wait at each rest stop for the others", "No, because the fast boys will get tired too early"], "answer": "B", "explanation": "Rogo refuses to swap and tells them to work on the constraint itself, which leads to examining Herbie's pack. Moving Herbie elsewhere would not make him walk faster, and speed at the front gains nothing for the group.", "points": 1.5, "lessons": [{"title": "The slowest hiker sets the pace: a framework for managing a bottleneck", "author": "Eliyahu M. Goldratt & Jeff Cox", "book": "The Goal", "when": "11/11 au soir"}]}, {"n": 3, "type": "truefalse", "question": "When a business has no customer history in year one, Masterson says to plan with a single scenario: customers spend 100% of their first purchase over time.", "options": [], "answer": false, "explanation": "He recommends two scenarios: 50 percent (conservative) and 100 percent (realistic). Planning on only one figure removes the margin for error that his whole approach is designed to protect.", "points": 1.5, "lessons": [{"title": "From $120 gross profit to a $12 allowable acquisition cost: Masterson's worked example", "author": "Michael Masterson", "book": "Ready, Fire, Aim", "when": "12/11 au soir"}]}, {"n": 4, "type": "multi", "question": "Which of these belong to Hormozi's seven-day closing campaign?", "options": ["Send a text the day before asking for a simple thumbs up", "Run it for a month so every lead has time to decide", "Pair text and email: the text gets attention, the email carries the detail", "Book calls right away so every conversation happens before the deadline", "If it has not sold out by day four, keep sending it unchanged"], "answer": ["A", "C", "D"], "explanation": "One week is chosen because longer kills urgency and shorter prevents meeting everyone. If the offer has not sold out by day three or four, he says to improve the offer before sending the rest, not to push harder on the same one.", "points": 2.0, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 5, "type": "multi", "question": "Which statements describe Tim Batchelor's rollout of the presentation skills programme?", "options": ["Early participants wrote down one thing they liked about the session", "The posters displayed comments written by senior management", "Newcomers read colleagues' comments on the walls before any training began", "The collected statements were later used to win backing from senior managers", "He relied on telling staff the programme was new and different"], "answer": ["A", "C", "D"], "explanation": "The voices on the wall were peers, which is the mechanism. Telling sceptical veterans that it was new would have come from the people selling the programme, so he avoided relying on that.", "points": 2.0, "lessons": [{"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}]}, {"n": 6, "type": "mcq", "question": "According to Williams, what does the story of Don Quixote and Walter Mitty tell the advertiser to do?", "options": ["Be strictly honest and tell the buyer to grow up", "Talk to the knight and the captain the buyer sees inside, not the person the world sees", "Target the demographic facts of the buyer as precisely as possible", "Flatter the buyer about the product's quality"], "answer": "B", "explanation": "Williams says strict honesty would tell Don and Walter to grow up, but selling and pleasing them means addressing their private self-image. The measurable facts about the buyer are the world he says you should look past.", "points": 1.5, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 7, "type": "mcq", "question": "In Hormozi's worked example (100 clicks), which price earns the most in total?", "options": ["$10: 5 buyers worth $100 each", "$20: 4 buyers worth $200 each", "$100: 2 buyers worth $300 each", "All three are about equal"], "answer": "B", "explanation": "$10 gives $500, $20 gives $800 and $100 gives $600. The best price is the one that maximizes total money, not the one with the most buyers or the highest unit price.", "points": 1.5, "lessons": [{"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 8, "type": "truefalse", "question": "Hormozi notes that price has a hard floor at zero while cost has no ceiling.", "options": [], "answer": false, "explanation": "It is the reverse: price has no ceiling, and cost has a hard floor at zero. That is why he treats cost reduction as the second lever after price.", "points": 1.5, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 9, "type": "mcq", "question": "What do Hormozi's 'impatience mistake' hook and Williams's Don Quixote lesson have in common?", "options": ["Both start from what the audience already believes about itself or its situation, not from the product", "Both open with a statistic that proves the result", "Both tell the audience the strict truth, even if it is unflattering", "Both rely on the seller's own track record as the main proof"], "answer": "A", "explanation": "Hormozi names a belief and timeline the viewer holds; Williams addresses the self-image the buyer holds. Only Hormozi uses his own record as proof, and only Williams argues against strict honesty, so those options each fit just one lesson.", "points": 2.0, "lessons": [{"title": "The impatience mistake: a hook that names a wrong belief and answers with your own record", "author": "Alex Hormozi", "book": "$100M Hooks Playbook", "when": "11/11 au matin"}, {"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 10, "type": "mcq", "question": "A service business delivers slowly because one stage cannot keep up. Which action fits both Goldratt and Hormozi?", "options": ["Speed up the fastest stages so work reaches the slow stage sooner", "Lighten the load on the slow stage, for example with templates or by capping usage", "Replace the slow stage's owner with someone who sets a faster pace", "Add a recurring meeting to coordinate between stages"], "answer": "B", "explanation": "Goldratt: the slowest element sets the system's speed, so work on the constraint itself. Hormozi: standardizing and capping usage make delivery faster and more consistent. Faster upstream stages only create a growing gap, and Hormozi suggests cutting meetings, not adding them.", "points": 2.0, "lessons": [{"title": "The slowest hiker sets the pace: a framework for managing a bottleneck", "author": "Eliyahu M. Goldratt & Jeff Cox", "book": "The Goal", "when": "11/11 au soir"}, {"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 11, "type": "open", "question": "Using Hormozi's closing campaign and his price math, explain how you would launch a higher-priced offer and how you would judge whether it worked.", "options": [], "answer": "Launch: a clear offer with a deadline, run for one week, text plus email, sequence from announcement to sold out, calls booked straight away. Benchmark: a strong offer sells out by day three or four; if not, improve the offer before sending the rest. Judging: look at total money, not the number of sales; a higher price with somewhat fewer buyers can earn more (doubling price while closing 20% fewer deals is worth it). Test on new customers first, then extend to existing ones if sales and churn hold.", "explanation": "The two lessons answer different halves: the first gives the mechanism that converts (clarity plus deadline, one week), the second gives the yardstick (total revenue across conversion and retention, not conversion alone).", "points": 3.0, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}, {"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
