<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 9/11 au 15/11</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W46", "title": "Semaine du 9/11 au 15/11", "total": 20, "lessons": 6, "questions": [{"n": 1, "type": "mcq", "question": "In Tim Batchelor's rollout, why did the posters on the wall persuade newcomers better than a message from the training team?", "options": ["They listed the programme's features in more detail than the team could in person", "They came from peers in the same position as the reader, not from the people selling the programme", "They were signed by senior managers who had already approved the programme", "They showed attendance figures from earlier workshops"], "answer": "B", "explanation": "The mechanism is that approval comes from people like the reader. Experienced staff would discount anything the organisers said, since the organisers are the ones selling. Management endorsement is the tempting wrong answer, but the lesson stresses the voices were peers, not management.", "points": 1.5, "lessons": [{"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}]}, {"n": 2, "type": "truefalse", "question": "Asking early participants to write down a comment helped only the later groups who read it; it did nothing for the writers themselves.", "options": [], "answer": false, "explanation": "The authors say the approach works twice: the written comments persuaded the next groups, and writing them also firmed up the writers' own positive opinion. Batchelor later reused the two hundred statements to win senior managers' support too.", "points": 1.5, "lessons": [{"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}]}, {"n": 3, "type": "multi", "question": "Which of these belong to Hormozi's closing-campaign advice?", "options": ["Use roughly a one-week window, because longer loses urgency and shorter prevents meeting everyone", "Send the text the day before as a question asking for a thumbs up", "If the offer has not sold out by day three or four, keep sending the rest of the sequence anyway", "Book calls right away so every conversation happens before the deadline", "Use email for attention and text for the detail"], "answer": ["A", "B", "D"], "explanation": "A, B and D are in the lesson. If the offer has not sold out by day three or four, he says to improve the offer before sending more. And it is the text that grabs attention while the email carries the detail, not the reverse.", "points": 2.0, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 4, "type": "mcq", "question": "In Masterson's example, a customer is worth $120 gross profit over their life, overhead is half of it, and he plans for 20% profit on $240 of gross sales. What is the allowable acquisition cost?", "options": ["$60", "$48", "$12", "$24"], "answer": "C", "explanation": "$120 minus $60 overhead leaves $60 net value; 20% of $240 is $48 to reserve as profit; $60 minus $48 leaves $12. The $60 and $48 are intermediate figures, not the spendable amount.", "points": 1.5, "lessons": [{"title": "From $120 gross profit to a $12 allowable acquisition cost: Masterson's worked example", "author": "Michael Masterson", "book": "Ready, Fire, Aim", "when": "12/11 au soir"}]}, {"n": 5, "type": "multi", "question": "Which of these does Hormozi list as ways to cut service delivery cost without changing the result?", "options": ["Raise the client-to-staff ratio", "Move from done-for-you to done-with-you", "Personalize each client's solution further", "Cap usage, such as limiting revisions and charging for extras", "Add a weekly meeting with every client"], "answer": ["A", "B", "D"], "explanation": "Higher ratios, done-with-you and usage caps are all on his list. He argues for productizing, the opposite of deeper personalization, and for cutting recurring meetings, not adding them.", "points": 2.0, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 6, "type": "truefalse", "question": "In Hormozi's worked example, raising the price from $10 to $20 loses one buyer out of five but lifts total revenue from $500 to $800.", "options": [], "answer": true, "explanation": "At $10, 5 buyers worth $100 each gives $500. At $20, 4 buyers worth $200 each gives $800, a 60% gain. Losing a sale hurts less than the doubled value per buyer helps.", "points": 1.5, "lessons": [{"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 7, "type": "mcq", "question": "According to Williams, what do Don Quixote and Walter Mitty show about how an ad should address the buyer?", "options": ["Speak to the buyer as the world sees them, with honest facts about their situation", "Speak to the buyer's private self-image, the knight or the captain, not the tired old man or the clerk", "Offer an escape from reality instead of the product", "Avoid fantasy and appeal only to measurable needs"], "answer": "B", "explanation": "Williams says strict honesty would tell them to grow up, but selling and pleasing them means talking to the inner hero. Mitty is not mad, he just cannot get the world to see who he is within.", "points": 1.5, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 8, "type": "mcq", "question": "A new service has no reviews yet, and your customers see themselves as experts. Using both lessons, what is the strongest first move?", "options": ["Collect specific written comments from early customers and show them to the next ones, framed so they reflect that expert self-image", "Run a seven-day campaign with an offer that expires and skip the testimonials", "Describe your credentials at length in the ad", "Lower the price until reviews appear"], "answer": "A", "explanation": "Batchelor's lesson gives the mechanism (peer comments persuade and commit the writers). Williams adds that people buy what matches who they believe they are, so peers who share that identity carry extra weight. Credentials come from the seller, the source that gets discounted.", "points": 2.0, "lessons": [{"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}, {"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 9, "type": "open", "question": "Using Hormozi's delivery-cost lesson and his price lesson, explain why he considers price a stronger lever than cost, and what you would still do on the cost side.", "options": [], "answer": "Price has no ceiling while cost has a floor at zero. Raising price can multiply revenue per buyer (the $10 to $20 example), while cost can only fall to zero. Even so, he would cut delivery cost without changing the outcome: higher client-to-staff ratio, productizing, done-with-you, usage caps, fewer meetings.", "explanation": "The key asymmetry is that cost bottoms out at zero while price can keep rising, so price gives more room. Cost cutting still improves gross profit directly as long as the client's result stays identical.", "points": 2.0, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}, {"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 10, "type": "multi", "question": "Which statements match Masterson's advice on planning customer value?", "options": ["Planning around a 10% net profit is risky because it leaves little room for mistakes, so he prefers at least 20% of gross sales", "Overhead for a retail operation is assumed to be about half of gross profit", "With no history, assume customers spend between 100 and 500 percent of their first purchase over time", "The allowable acquisition cost logic applies to all prices, including back-end products", "For planning, use only the conservative 50 percent scenario"], "answer": ["A", "B", "C"], "explanation": "A, B and C come straight from the passage. The logic is for front-end pricing of new customers only, and he recommends running two scenarios, 50 percent (conservative) and 100 percent (realistic), not one.", "points": 2.0, "lessons": [{"title": "From $120 gross profit to a $12 allowable acquisition cost: Masterson's worked example", "author": "Michael Masterson", "book": "Ready, Fire, Aim", "when": "12/11 au soir"}]}, {"n": 11, "type": "mcq", "question": "You are launching a higher-priced version of an offer. Which plan fits both Hormozi lessons?", "options": ["Announce to every existing customer on day one with no deadline", "Test the higher price on new customers first, use a clear offer with a deadline, and extend to existing customers only if sales and churn hold", "Keep the old price for a year to avoid losing sales", "Raise the price only for the biggest accounts and never test"], "answer": "B", "explanation": "The price lesson says to test on new customers first and extend if sales and churn hold. The closing lesson says clear offers with deadlines convert more of the leads you get. Skipping a deadline or the test breaks one of the two.", "points": 1.5, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}, {"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 12, "type": "mcq", "question": "Why does Hormozi say templated, uniform delivery to similar clients is not a downgrade?", "options": ["Clients do not notice the difference in quality", "Similar clients with similar problems can share one process, which makes delivery faster, more consistent and more profitable", "Custom work is illegal to bill for", "It lets you charge the same price for less value"], "answer": "B", "explanation": "He sees personalization as often waste in disguise: the same process serves similar problems, so results are quicker and more reliable. The result stays the same, which is the whole point of the exercise.", "points": 1.0, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
