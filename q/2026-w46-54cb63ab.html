<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrôle de la semaine · 9/11 au 15/11</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--line:#ddd8cc;--gold:#b8901c;--ok:#1f6f54;--okbg:#e6f3ee;--ko:#a12a2a;--kobg:#f8e9e9;--mid:#8a5a00;--midbg:#f8f0df}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#ecebe6;--mut:#a3a199;--line:#3a3934;--gold:#d8b24a;--ok:#6fd0ab;--okbg:#173229;--ko:#f09a9a;--kobg:#3a1d1d;--mid:#e3bd6c;--midbg:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line)}
.k{font:600 12px Arial,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}.q{font-size:19px;margin:0 0 18px;white-space:pre-line}
.s{font:14px/1.5 Arial,sans-serif;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
button{font:600 16px Arial,sans-serif;border-radius:10px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:13px 14px;margin:0 0 10px;font-weight:400;font-family:Georgia,serif;font-size:16.5px;line-height:1.4}
.opt b{font-family:Arial,sans-serif;margin-right:8px}.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--ko);background:var(--kobg)}
.go{background:var(--ink);color:var(--bg);border:0;padding:14px 20px;width:100%;margin-top:6px}.go:disabled{opacity:.35;cursor:default}
textarea{width:100%;min-height:110px;font:16px/1.45 Georgia,serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin:16px 0 4px}.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.mid{background:var(--midbg)}
.fb h3{font:700 16px Arial,sans-serif;margin:0 0 8px}.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.mid h3{color:var(--mid)}
.fb p{margin:0 0 8px;font-size:16px}.fb p:last-child{margin:0}.lab{font:700 12.5px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.score{font:700 64px Georgia,serif;margin:6px 0 0}.score small{font-size:26px;color:var(--mut)}
.miss{border-left:3px solid var(--ko);padding:2px 0 2px 14px;margin:18px 0}.miss.mid{border-color:var(--mid)}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
</style></head><body><main id="app"></main>
<script>const QUIZ = {"week": "2026-W46", "title": "Semaine du 9/11 au 15/11", "total": 20, "lessons": 12, "questions": [{"n": 1, "type": "truefalse", "question": "For a free trial with penalty fees, Hormozi says honesty requires explaining every fee before you ask for the customer's card.", "options": [], "answer": false, "explanation": "Hormozi says the opposite: take the card first, then explain the fees in a matter-of-fact tone, which in his experience raised his take rate. He is not hiding anything: the customer still has to accept the fees, and has to initial each fee clause separately.", "points": 1.5, "lessons": [{"title": "Why Hormozi collects the card before he explains the fees", "author": "Alex Hormozi", "book": "$100M Money Models", "when": "9/11 au soir"}]}, {"n": 2, "type": "mcq", "question": "According to Brunson's Hook, Story, Offer framework, a funnel is not working. Where does he say the fault lies?", "options": ["In the price, because buyers compare it with competitors", "In one of the three parts: the hook, the story or the offer", "In the traffic source, since the funnel itself is always sound", "In the offer only, because hook and story are cosmetic"], "answer": "B", "explanation": "Brunson says every piece contains all three parts, so if something is not working, the problem is in one of them and nowhere else. The tempting answer D wrongly shrinks it to the offer: the hook (attention) and the story (perceived worth) are just as likely to be the cause.", "points": 1.5, "lessons": [{"title": "Perceived value must exceed price, and story is what lifts it", "author": "Russell Brunson", "book": "Expert Secrets", "when": "10/11 au matin"}]}, {"n": 3, "type": "truefalse", "question": "In Cialdini's account of the Chinese prison camps, a prisoner who refused to compose a pro-Communist statement was left alone, because only voluntary writing could change his self-image.", "options": [], "answer": false, "explanation": "A prisoner who refused to compose it was asked just to copy it, which looked like a harmless concession. Cialdini's point is that even small, seemingly trivial written acts can start shifting self-image, because writing is physical proof and can be shown to others.", "points": 1.5, "lessons": [{"title": "Why Written Commitments Change How You See Yourself", "author": "Robert Cialdini", "book": "Influence", "when": "10/11 au soir"}]}, {"n": 4, "type": "mcq", "question": "In the 'impatience mistake' hook, what does Hormozi use as proof against people who expect a podcast to take off in 90 days?", "options": ["He cites the share of podcasts that fail in their first year", "He says he recorded a hundred and fifty episodes about running a gym better when he started", "He promises a method that makes a podcast grow faster than 90 days", "He lists the metrics a podcast should reach after three months"], "answer": "B", "explanation": "The hook sets the audience's expected timeline against his own beginnings: a hundred and fifty early episodes. The viewer compares timelines instead of trusting an assertion. No statistic or promised shortcut is offered, which is why the other options are wrong.", "points": 1.5, "lessons": [{"title": "The impatience mistake: a hook that names a wrong belief and answers with your own record", "author": "Alex Hormozi", "book": "$100M Hooks Playbook", "when": "11/11 au matin"}]}, {"n": 5, "type": "mcq", "question": "In the hike from The Goal, after Rogo reverses the line so Herbie is first, what single rule does he impose?", "options": ["The fastest boys must carry Herbie's pack", "Nobody may pass anybody; each boy keeps up with the one in front", "Each boy must keep the same spacing, measured with a rope", "Herbie sets a pace and the others may overtake during rests"], "answer": "B", "explanation": "Putting the constraint at the front and forbidding passing keeps the group together, and no gaps open up. Moving Herbie elsewhere would not make him walk faster. The pack question comes later, as the way to speed up the constraint itself.", "points": 1.5, "lessons": [{"title": "The slowest hiker sets the pace: a framework for managing a bottleneck", "author": "Eliyahu M. Goldratt & Jeff Cox", "book": "The Goal", "when": "11/11 au soir"}]}, {"n": 6, "type": "truefalse", "question": "In Tim Batchelor's rollout, asking early participants to write a comment helped the later groups and also strengthened the feelings of the people who wrote it.", "options": [], "answer": true, "explanation": "The authors call it clever because the same step works twice: the written comments persuaded newcomers, and writing them made the authors' own positive opinion firmer. The comments were also reused later to win support from senior managers.", "points": 1.5, "lessons": [{"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}]}, {"n": 7, "type": "mcq", "question": "In Masterson's example, lifetime net value is $60 and lifetime gross sales are $240. What does he subtract to reach the $12 allowable acquisition cost?", "options": ["$48, which is 20 percent of the lifetime gross sales", "$24, which is 20 percent of the $120 gross profit", "$30, which is half of the net value", "$12, which is 10 percent of the gross sales"], "answer": "A", "explanation": "He reserves the profit he intends to earn: 20 percent of gross sales ($240) is $48, and $60 minus $48 leaves $12. The 10 percent figure is typical for retailers, but he deliberately plans for 20 to leave room for mistakes.", "points": 1.5, "lessons": [{"title": "From $120 gross profit to a $12 allowable acquisition cost: Masterson's worked example", "author": "Michael Masterson", "book": "Ready, Fire, Aim", "when": "12/11 au soir"}]}, {"n": 8, "type": "mcq", "question": "In Hormozi's seven-day closing campaign, what is his benchmark for a strong offer, and what does he do if it is missed?", "options": ["It sells out by day three or four; otherwise he improves the offer before sending the rest", "It sells out by day six; otherwise he extends the deadline by a week", "It books half the calls on day one; otherwise he lowers the price", "It sells out on day two; otherwise he repeats the same text"], "answer": "A", "explanation": "A strong offer sells out by day three or four. If it has not, he fixes the offer first. Extending the deadline would weaken the urgency, which is why he chose one week: longer and urgency fades.", "points": 1.5, "lessons": [{"title": "A clear offer plus a deadline: Hormozi's seven-day closing campaign", "author": "Alex Hormozi", "book": "$100M Fast Cash Playbook", "when": "13/11 au matin"}]}, {"n": 9, "type": "multi", "question": "Which of these does Hormozi list as ways to lower service delivery costs while keeping the same result?", "options": ["Raise the client-to-staff ratio", "Personalize each solution more for every client", "Move from done-for-you to done-with-you", "Add recurring meetings to keep clients informed", "Cap usage, for example limiting revisions and charging for extra ones"], "answer": ["A", "C", "E"], "explanation": "Higher ratios, done-with-you and usage caps are all on his list. The other two run the opposite way: he sees personalization as often waste in disguise, and he suggests wiping out recurring meetings each quarter and adding back only the necessary ones.", "points": 2.0, "lessons": [{"title": "Deliver less personally to deliver better: Hormozi's case for cheaper service", "author": "Alex Hormozi", "book": "$100M Lifetime Value Playbook", "when": "14/11 au matin"}]}, {"n": 10, "type": "multi", "question": "Which of these follow from Williams's advice to advertise to the person the customer believes they are?", "options": ["Picture the buyer's self-image rather than the measurable facts about them", "Tell the buyer, honestly, to be realistic about who they are", "Write the ad to the inner hero, as with the knight and the captain", "Open with demographic statistics about the audience", "Give people a statement of identity they can claim, as Mr. Foster did with 'No Wimpy Wines'"], "answer": ["A", "C", "E"], "explanation": "Williams says strict honesty would tell Don and Walter to grow up, but selling means speaking to the knight and the captain. Because most buying is self-expression, a bold identity line can create loyalty before the product is tasted. Demographics describe the outer world, not the private self-image.", "points": 2.0, "lessons": [{"title": "Advertise to the person your customer believes they are", "author": "Roy H. Williams", "book": "The Wizard of Ads", "when": "13/11 au soir"}]}, {"n": 11, "type": "mcq", "question": "A seller wants to win new customers and is tempted to slash the front-end price. Using Masterson and Hormozi, what is the soundest way to decide?", "options": ["Pick the lowest price, since more buyers always means more money", "Compare total money earned at several prices, counting buyers and how long they stay, and never let the first-sale loss exceed the allowable acquisition cost", "Match the competitor's price, since buyers compare the two directly", "Raise the price to the maximum, since price has no ceiling and conversion barely matters"], "answer": "B", "explanation": "Hormozi's best price is the one that earns the most in total, which depends on how price moves both buyers and retention (his $20 example beat both $10 and $100). Masterson adds the limit: a first-sale loss is fine up to the allowable acquisition cost. Options A and D each ignore half of the picture.", "points": 2.0, "lessons": [{"title": "From $120 gross profit to a $12 allowable acquisition cost: Masterson's worked example", "author": "Michael Masterson", "book": "Ready, Fire, Aim", "when": "12/11 au soir"}, {"title": "What is the best price? Hormozi's answer and the math behind it", "author": "Alex Hormozi", "book": "$100M Price Raise Playbook", "when": "14/11 au soir"}]}, {"n": 12, "type": "mcq", "question": "An offer is fairly priced but buyers hesitate; they think it is one more thing they have seen before. Which move fits both Brunson and Goldstein, Martin and Cialdini?", "options": ["Tell them in your own words that it is different and better", "Cut the price until the gap with competitors is obvious", "Show written comments from peers in their position and tell the story of how you earned what is in the offer, before presenting it", "Add a deadline and repeat the pitch more often"], "answer": "C", "explanation": "Brunson says the story raises the perceived worth of the offer more than anything else, so a sale depends on the gap between worth and price. Batchelor's lesson adds that claims from the organiser carry little weight, while endorsements from similar people do. Lowering the price attacks the wrong side of the gap.", "points": 2.0, "lessons": [{"title": "Perceived value must exceed price, and story is what lifts it", "author": "Russell Brunson", "book": "Expert Secrets", "when": "10/11 au matin"}, {"title": "Testimonials that work twice: the bandwagon effect in a training rollout", "author": "Noah Goldstein, Steve Martin & Robert Cialdini", "book": "Yes! 50 Scientifically Proven Ways to Be Persuasive", "when": "12/11 au matin"}]}]};</script>
<script>
(function(){
var app=document.getElementById('app'),Q=QUIZ.questions,i=-1,log=[];
var L='ABCDEFGH',TYPE={mcq:'Une seule bonne réponse',multi:'Plusieurs bonnes réponses',truefalse:'Vrai ou faux',open:'Réponse libre'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pts(p){return (''+p).replace('.',',')+(p>1?' points':' point')}
function lab(parent,title,text){var p=el('p');p.appendChild(el('span','lab',title));p.appendChild(document.createTextNode(text));parent.appendChild(p)}
function lessonText(l){return '« '+l.title+' » · '+l.author+', '+l.book+' · reçue le '+l.when}
function expected(q){
  if(q.type==='mcq')return q.answer+'. '+q.options[L.indexOf(q.answer)];
  if(q.type==='multi')return q.answer.map(function(a){return a+'. '+q.options[L.indexOf(a)]}).join('  ·  ');
  if(q.type==='truefalse')return q.answer?'Vrai':'Faux';
  return q.answer}
function start(){
  app.innerHTML='';var c=el('div','card');c.appendChild(el('p','k','Contrôle hebdomadaire'));c.appendChild(el('h1',null,QUIZ.title));
  c.appendChild(el('p',null,Q.length+' questions sur les '+QUIZ.lessons+' leçons de la semaine. Note sur '+QUIZ.total+'.'));
  c.appendChild(el('p','s','Réponds de mémoire, sans rouvrir les leçons. Chaque réponse est corrigée tout de suite : juste ou faux, la bonne réponse, et pourquoi.'));
  var b=el('button','go','Commencer');b.onclick=next;c.appendChild(b);app.appendChild(c)}
function next(){i++;if(i>=Q.length)return end();show(Q[i])}
function show(q){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var bar=el('div','bar'),f=el('i');f.style.width=(100*i/Q.length)+'%';bar.appendChild(f);c.appendChild(bar);
  c.appendChild(el('p','k','Question '+(i+1)+' sur '+Q.length+' · '+TYPE[q.type]+' · '+pts(q.points)));
  c.appendChild(el('p','q',q.question));
  var box=el('div');c.appendChild(box);var go=el('button','go','Valider');go.disabled=true;var picked=[];
  if(q.type==='open'){
    var ta=el('textarea');ta.placeholder='Écris ta réponse en une ou deux phrases, puis compare.';box.appendChild(ta);
    go.textContent='Voir la réponse';go.disabled=false;
    go.onclick=function(){ta.disabled=true;go.remove();openFb(c,q,ta.value)};
  }else{
    var opts=q.type==='truefalse'?['Vrai','Faux']:q.options;
    opts.forEach(function(o,k){
      var key=q.type==='truefalse'?(k===0):L[k];var b=el('button','opt');
      if(q.type!=='truefalse'){b.appendChild(el('b',null,L[k]+'.'))}b.appendChild(document.createTextNode(o));b.dataset.k=''+key;
      b.onclick=function(){
        if(q.type==='multi'){var p=picked.indexOf(key);if(p<0)picked.push(key);else picked.splice(p,1);b.classList.toggle('sel')}
        else{picked=[key];[].forEach.call(box.children,function(x){x.classList.remove('sel')});b.classList.add('sel')}
        go.disabled=picked.length===0};
      box.appendChild(b)});
    go.onclick=function(){
      var good=q.type==='multi'?q.answer:[q.answer];
      var ok=picked.length===good.length&&picked.every(function(p){return good.indexOf(p)>=0});
      [].forEach.call(box.children,function(x){x.disabled=true;var k=q.type==='truefalse'?(x.dataset.k==='true'):x.dataset.k;
        if(good.indexOf(k)>=0)x.classList.add('good');else if(picked.indexOf(k)>=0)x.classList.add('bad')});
      go.remove();
      var given=q.type==='truefalse'?(picked[0]?'Vrai':'Faux'):picked.slice().sort().join(', ');
      feedback(c,q,ok?q.points:0,given)}}
  c.appendChild(go);app.appendChild(c)}
function openFb(c,q,given){
  var fb=el('div','fb mid');fb.appendChild(el('h3',null,'Compare avec la réponse attendue'));
  lab(fb,'Réponse attendue',q.answer);lab(fb,'Pourquoi',q.explanation);c.appendChild(fb);
  c.appendChild(el('p','s','Sois honnête avec toi-même : ta réponse contenait-elle l\'idée ?'));
  var row=el('div','row');[['Oui, tout',1],['En partie',.5],['Non',0]].forEach(function(o){
    var b=el('button',null,o[0]);b.onclick=function(){row.remove();log.push({q:q,got:q.points*o[1],given:given||'(vide)'});nextBtn(c,q,o[1]<1)};row.appendChild(b)});
  c.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'center'})}
function feedback(c,q,got,given){
  log.push({q:q,got:got,given:given});var ok=got>=q.points;
  var fb=el('div','fb '+(ok?'ok':'ko'));fb.appendChild(el('h3',null,ok?'Juste · +'+pts(q.points):'Faux · 0 point'));
  if(!ok)lab(fb,'Bonne réponse',expected(q));lab(fb,'Pourquoi',q.explanation);
  c.appendChild(fb);nextBtn(c,q,!ok);fb.scrollIntoView({behavior:'smooth',block:'center'})}
function nextBtn(c,q,showLesson){
  if(showLesson){var p=el('p','s');p.appendChild(el('span','lab','À relire'));p.appendChild(document.createTextNode(q.lessons.map(lessonText).join('  |  ')));c.appendChild(p)}
  var b=el('button','go',i+1<Q.length?'Question suivante':'Voir ma note');b.onclick=next;c.appendChild(b)}
function end(){
  app.innerHTML='';window.scrollTo(0,0);var c=el('div','card');
  var total=log.reduce(function(s,r){return s+r.got},0);total=Math.round(total*2)/2;
  var right=log.filter(function(r){return r.got>=r.q.points}).length,missed=log.filter(function(r){return r.got<r.q.points});
  c.appendChild(el('p','k','Ta note de la semaine'));var s=el('p','score',(''+total).replace('.',','));s.appendChild(el('small',null,' / '+QUIZ.total));c.appendChild(s);
  c.appendChild(el('p',null,right+' réponses justes sur '+Q.length+'.'+(missed.length?'':' Rien à revoir cette semaine.')));
  if(missed.length){
    var seen={},ul=el('ul');missed.forEach(function(r){r.q.lessons.forEach(function(l){if(!seen[l.title]){seen[l.title]=1;ul.appendChild(el('li',null,lessonText(l)))}})});
    c.appendChild(el('p','k','À revoir'));c.appendChild(ul);
    c.appendChild(el('p','k','Ce que tu as manqué'));
    missed.forEach(function(r){var d=el('div','miss'+(r.got>0?' mid':''));d.appendChild(el('p',null,'Question '+r.q.n+' · '+r.q.question));
      lab(d,'Ta réponse',r.given);lab(d,'Ce qu\'il fallait répondre',expected(r.q));lab(d,'Pourquoi',r.q.explanation);c.appendChild(d)})}
  try{localStorage.setItem('quiz_'+QUIZ.week,JSON.stringify({score:total,date:new Date().toISOString()}))}catch(e){}
  var b=el('button','go','Recommencer');b.onclick=function(){i=-1;log=[];start()};c.appendChild(b);app.appendChild(c)}
start();
})();
</script></body></html>
